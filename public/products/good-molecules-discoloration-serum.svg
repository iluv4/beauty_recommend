  <text x="300" y="180" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="3" fill="#7a3b18" opacity="0.85">GOOD MOLECULES</text>
  <text text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#7a3b18"><tspan x="300" y="252">Discoloration</tspan><tspan x="300" y="311">Correcting</tspan><tspan x="300" y="370">Serum</tspan></text>
  <text x="300" y="486" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" letter-spacing="4" fill="#7a3b18" opacity="0.7">SERUM</text>
