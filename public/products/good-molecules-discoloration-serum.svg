<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-label="Good Molecules Discoloration Correcting Serum">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9d6"/>
      <stop offset="1" stop-color="#ffc7a8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="250" fill="#ffffff" opacity="0.18"/>
  <!-- abstract bottle silhouette -->
  <g fill="#ffffff" opacity="0.30">
